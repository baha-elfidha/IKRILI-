databases:
  - name: ikrili-db
    plan: free
    databaseName: ikrili
    user: ikrili

services:
  - type: web
    name: ikrili
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Ajoute les universités au démarrage (sans annonces de démo), puis lance le serveur
    startCommand: flask --app wsgi seed --no-demo && gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ikrili-db
          property: connectionString
