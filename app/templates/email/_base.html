<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IKRILI</title></head>
<body style="margin:0; padding:0; background:#EEF1FF; font-family:Arial, Helvetica, sans-serif; color:#0E1530;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EEF1FF; padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background:#ffffff; border-radius:20px; overflow:hidden;">
        <tr><td style="background:#2D4BF0; padding:22px 28px;">
          <span style="font-size:24px; font-weight:bold; color:#ffffff; letter-spacing:-0.5px;">ikrili</span>
        </td></tr>
        <tr><td style="padding:30px 28px 10px; font-size:16px; line-height:1.6;">
          {% block content %}{% endblock %}
        </td></tr>
        {% if link %}
        <tr><td style="padding:10px 28px 8px;">
          <a href="{{ link }}" style="display:inline-block; background:#2D4BF0; color:#ffffff; text-decoration:none; font-weight:bold; font-size:16px; padding:14px 26px; border-radius:999px;">{% block button %}{% endblock %}</a>
        </td></tr>
        <tr><td style="padding:14px 28px 4px; font-size:13px; line-height:1.5; color:#4B5470;">
          Si le bouton ne fonctionne pas, copie ce lien dans ton navigateur :<br>
          <a href="{{ link }}" style="color:#2D4BF0; word-break:break-all;">{{ link }}</a>
        </td></tr>
        {% endif %}
        <tr><td style="padding:22px 28px 28px; font-size:13px; line-height:1.5; color:#4B5470;">
          {% block footer_note %}{% endblock %}
          <br><br>— L'équipe IKRILI · Le logement à louer en Tunisie, simplement.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
