{% extends "base.html" %}
{% block title %}Signaler une annonce – IKRILI{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 sm:px-6 py-10 flex flex-col gap-6">
  <h1 class="text-3xl font-extrabold tracking-tight">Signaler l'annonce</h1>
  <p class="text-muted">« {{ listing.title }} » – {{ listing.city }}</p>
  <form method="post" class="flex flex-col gap-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <fieldset class="flex flex-col gap-2.5">
      <legend class="font-bold mb-2">Motif</legend>
      {% for value, label in reasons %}
        <label class="flex items-center gap-2.5"><input type="radio" name="reason" value="{{ value }}" required class="w-[18px] h-[18px]"> {{ label }}</label>
      {% endfor %}
    </fieldset>
    <label class="flex flex-col gap-1.5 font-semibold text-sm">Détails (facultatif)
      <textarea name="details" rows="4" class="px-3 py-2.5 rounded-lg border-[1.5px] border-[#D9DDEA] font-normal"></textarea>
    </label>
    <button type="submit" class="self-start min-h-[48px] px-6 rounded-xl bg-warn text-white font-bold">Envoyer le signalement</button>
  </form>
</div>
{% endblock %}
